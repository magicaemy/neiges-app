<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Neiges D'Antan</title>
<link rel="manifest" href="/manifest.json">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Les Neiges">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e3dd;--acc:#1f5f5b;--acc-ink:#fff;--warn:#c2410c;--warn-bg:#ffedd5;--danger:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2229;--ink:#eceff4;--mute:#9aa3b2;--line:#2b323c;--acc:#4fb3aa;--acc-ink:#0d1b1a;--warn:#fdba74;--warn-bg:#3a2415;--danger:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
.me{font-size:14px;color:var(--mute);background:none;border:0;cursor:pointer;padding:6px 8px;border-radius:8px}
.nav-main{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:14px;border:1px solid var(--line);margin-bottom:14px}
.nav-btn{flex:1;border:0;background:none;color:var(--ink);padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;text-align:center}
.nav-btn.on{background:var(--acc);color:var(--acc-ink)}
.push-bar{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;gap:8px}
.push-bar button{background:var(--warn);color:#fff;border:0;padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.dot{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;text-align:center;margin-left:6px;padding:0 5px}
.add,.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=time]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input[type=text]{flex:1 1 140px}
button.pri{font:inherit;background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
button.sec{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
button.media-icon{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
button.icon-btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:14px}
button.del-sm{background:none;border:0;color:var(--danger);cursor:pointer;font-size:16px;padding:4px 8px;font-weight:700}
label.u{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.task.done{opacity:.55}.task.done .t{text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;cursor:pointer;color:var(--acc-ink);font-size:14px}
.task.done .chk{background:var(--acc);border-color:var(--acc)}
.body{flex:1;min-width:0}.t{font-weight:600;word-break:break-word}
.meta{font-size:13px;color:var(--mute);margin-top:2px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);margin-right:6px}
.tag.u{background:var(--warn-bg);color:var(--warn);font-weight:600}
.tag.p{background:#e0e7ff;color:#3730a3;font-weight:600}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;padding:0 4px}
.empty{text-align:center;color:var(--mute);padding:24px 0}
.toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:40}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.box{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto}
.box h2{margin:0 0 6px;font-size:18px}.box p{margin:0 0 12px;color:var(--mute);font-size:14px}
.opt{display:flex;align-items:center;gap:10px;padding:6px 0}.opt input{width:18px;height:18px}

/* Foto allegate */
.photo-preview-wrap{position:relative;display:inline-block;margin-top:4px}
.photo-preview-wrap img{max-height:110px;border-radius:10px;border:1px solid var(--line);display:block}
.photo-remove{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;border:0;font-size:13px;font-weight:700;cursor:pointer;line-height:1}
.task-img{margin-top:8px;max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--line);cursor:pointer;display:block;object-fit:cover}
.lightbox-img{max-width:100%;max-height:75vh;border-radius:12px;display:block;margin:0 auto}

/* Turni styles */
.week-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-weight:600}
.day-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.day-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.day-head.clickable{cursor:pointer;color:var(--acc)}
.day-head.clickable:hover{opacity:.8}
.person-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);gap:8px}
.person-row:last-child{border-bottom:0;padding-bottom:0}
.person-name{font-weight:600;min-width:95px}
.shift-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.shift-pill{background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;line-height:1.3}
.slot-toggle{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-align:left}
.slot-toggle.active{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.admin-section{border:2px solid var(--acc);background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px}
.admin-title{font-weight:700;color:var(--acc);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:6px}
.list-item:last-child{border-bottom:0}
.slot-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.sub-lbl{font-size:12px;color:var(--mute);font-weight:600}
</style>

<body>
<div class="wrap">

    <h1>❄️ Les Neiges D'Antan</h1>

    <div id="adminPanel" class="admin-section" style="display:none">

      <div id="adminBody" style="display:none; margin-top:10px">

<div id="toasts"></div>
<div id="modal"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getMessaging,getToken,onMessage} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyCKV5TLrYRR6ToXvEv7pXyBeBrkwnTskvc",
  authDomain: "neiges---to-do-list.firebaseapp.com",
  projectId: "neiges---to-do-list",
  storageBucket: "neiges---to-do-list.firebasestorage.app",
  messagingSenderId: "315683814261",
  appId: "1:315683814261:web:b52934b3c3a22e46f4713c"
};
const VAPID_KEY = "BFvia4Nz5hHpoABwFI3U8KbXvMdvXuDUR2CNav7suYQStqhzLTMnFfxaeCitqIxa6Gxv4H37nMM45-N67R2p2TU";
const ADMIN_PIN = "1508";

const LISTS = ["Reception","Pulizie","Manutenzione","Colazione","Pranzo","Cena","Generale"];
const LS = "neiges.profile";
let profile = null, db = null, messaging = null, uid = null;
let tasks = [], filter = "👤", first = true, unread = {};
let activeMainTab = "todo";
let pendingPhotoDataUrl = "";

let isAdmin = false;
let isAdminOpen = false;
let shiftFilter = "all";
let weekOffset = 0;

const deptData = {
  sala: { staff: [], slots: [], shifts: {}, label: "Sala", colPrefix: "sala" },
  reception: { staff: [], slots: [], shifts: {}, label: "Reception", colPrefix: "reception" }
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const loadProfile = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch(e) { return null; } };

function formatSlotTime(s) {
  const s1 = s.start1 || s.start || "";
  const e1 = s.end1 || s.end || "";
  const s2 = s.start2 || "";
  const e2 = s.end2 || "";
  let txt = `${s1}–${e1}`;
  if (s2 && e2) txt += ` / ${s2}–${e2}`;
  return txt;
}

function toast(msg) {
  const d = document.createElement("div");
  d.className = "toast";
  d.textContent = msg;
  $("toasts").appendChild(d);
  setTimeout(() => d.remove(), 4500);
}

// --- COMPRESSIONE FOTO (FOTOCAMERA O GALLERIA) ---
function compressImage(file, maxDim = 800, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleSelectedFile(file, btnEl, defaultIcon) {
  if (!file) return;
  try {
    btnEl.textContent = "⏳";
    pendingPhotoDataUrl = await compressImage(file);
    $("photoPreviewImg").src = pendingPhotoDataUrl;
    $("photoPreviewArea").style.display = "block";
  } catch (err) {
    alert("Impossibile caricare la foto selezionata.");
  } finally {
    btnEl.textContent = defaultIcon;
  }
}

$("cameraBtn").onclick = () => $("cameraInput").click();
$("galleryBtn").onclick = () => $("galleryInput").click();

$("cameraInput").onchange = async (e) => {
  const file = e.target.files?.[0];
  await handleSelectedFile(file, $("cameraBtn"), "📷");
  $("cameraInput").value = "";
};

$("galleryInput").onchange = async (e) => {
  const file = e.target.files?.[0];
  await handleSelectedFile(file, $("galleryBtn"), "🖼️");
  $("galleryInput").value = "";
};

$("removePhotoBtn").onclick = () => {
  pendingPhotoDataUrl = "";
  $("photoPreviewImg").src = "";
  $("photoPreviewArea").style.display = "none";
};

function openPhotoModal(src, title) {
  $("modal").innerHTML = `<div class="modal"><div class="box">
    <h2>📷 ${esc(title)}</h2>
    <img class="lightbox-img" src="${src}" alt="Foto task">
    <div class="row" style="margin-top:14px">
      <button class="pri" id="closePhotoModal" style="flex:1">Chiudi</button>
    </div>
  </div></div>`;
  $("closePhotoModal").onclick = () => { $("modal").innerHTML = ""; };
}

// --- PUSH NOTIFICATIONS ---
async function registerPush(silent = false) {
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !db || !messaging) return;
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") {
      $("pushBanner").style.display = "flex";
      if (!silent) alert("Permesso notifiche negato. Controlla Impostazioni > Notifiche > Les Neiges D'Antan.");
      return;
    }

    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) {
      if (r.active && !r.active.scriptURL.includes("firebase-messaging-sw.js")) {
        await r.unregister();
      }
    }

    const reg = await navigator.serviceWorker.register("/firebase-messaging-sw.js", { scope: "/" });
    await navigator.serviceWorker.ready;

    const token = await getToken(messaging, {
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: reg
    });

    if (token) {
      await setDoc(doc(db, "tokens", token), {
        token,
        uid: uid || "",
        name: profile?.name || "Staff",
        follow: profile?.follow || LISTS,
        platform: navigator.userAgent,
        updatedAt: Date.now()
      });
      $("pushBanner").style.display = "none";
      if (!silent) toast("✅ Notifiche a schermo bloccato attive!");
    } else {
      $("pushBanner").style.display = "flex";
    }
  } catch (e) {
    $("pushBanner").style.display = "flex";
    if (!silent) alert("Errore attivazione notifiche: " + (e.message || e));
  }
}
$("enablePushBtn").onclick = () => registerPush(false);

// --- PROFILE MODAL ---
function profileModal() {
  const p = profile || { name: "", follow: [...LISTS] };
  if (!p.follow.includes("Generale")) p.follow.push("Generale");
  $("modal").innerHTML = `<div class="modal"><div class="box">
    <h2>Benvenuto 👋</h2>
    <p>Inserisci il tuo nome e scegli le liste da seguire:</p>
    <input type="text" id="pn" placeholder="Il tuo nome (es. Lorenzo)" value="${esc(p.name)}" style="width:100%;margin-bottom:10px">
    ${LISTS.map((l, i) => {
      const isGen = l === "Generale";
      const isChecked = isGen || (p.follow && p.follow.includes(l));
      return `<label class="opt"><input type="checkbox" data-l="${i}" ${isChecked ? "checked" : ""} ${isGen ? "disabled" : ""}>${esc(l)}${isGen ? ' <span style="font-size:12px;color:var(--mute)">(sempre attivo per tutti)</span>' : ""}</label>`;
    }).join("")}
    <div class="row" style="margin-top:14px"><button class="pri" id="okProfile" style="flex:1">Salva</button></div>
  </div></div>`;
  $("okProfile").onclick = () => {
    const name = $("pn").value.trim();
    if (!name) { $("pn").focus(); return; }
    let follow = [...document.querySelectorAll("[data-l]")].filter(c => c.checked).map(c => LISTS[c.dataset.l]);
    if (!follow.includes("Generale")) follow.push("Generale");
    profile = { name, follow };
    localStorage.setItem(LS, JSON.stringify(profile));
    filter = "👤";
    $("modal").innerHTML = "";
    renderTodo();
    if (activeMainTab !== "todo") renderShifts();
    registerPush(true);
  };
}

// --- MAIN TABS SWITCH ---
function setMainTab(tab) {
  activeMainTab = tab;
  isAdmin = false;
  isAdminOpen = false;
  $("navTodo").classList.toggle("on", tab === "todo");
  $("navSala").classList.toggle("on", tab === "sala");
  $("navReception").classList.toggle("on", tab === "reception");
  $("viewTodo").style.display = tab === "todo" ? "block" : "none";
  $("viewShifts").style.display = tab !== "todo" ? "block" : "none";
  if (tab !== "todo") renderShifts();
}
$("navTodo").onclick = () => setMainTab("todo");
$("navSala").onclick = () => setMainTab("sala");
$("navReception").onclick = () => setMainTab("reception");

// --- TO DO LIST RENDER & ACTIONS ---
function renderTodo() {
  if (!profile) return;
  $("me").textContent = "👤 " + profile.name;
  $("me").onclick = profileModal;

  const followedLists = (profile.follow && profile.follow.length > 0) ? profile.follow : LISTS;
  const visibleTabs = ["👤", ...followedLists];

  if (!visibleTabs.includes(filter)) {
    filter = "👤";
  }

  $("tabs").innerHTML = visibleTabs.map(n => {
    const c = unread[n] || 0;
    return `<button class="tab ${n === filter ? "on" : ""}" data-n="${esc(n)}">${esc(n)}${c ? `<span class="dot">${c}</span>` : ""}</button>`;
  }).join("");

  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => {
    filter = b.dataset.n;
    if (filter === "👤") unread["👤"] = 0; else unread[filter] = 0;
    renderTodo();
  });

  const isPersonalTab = (filter === "👤");

  const vis = tasks.filter(t => {
    if (isPersonalTab) {
      const isMyPrivate = t.private && t.byId === uid;
      const isAssignedToMe = (t.assignedTo && t.assignedTo.trim().toLowerCase() === profile.name.trim().toLowerCase()) ||
                             (t.title.toLowerCase().includes(profile.name.trim().toLowerCase()));
      return isMyPrivate || isAssignedToMe || (t.byId === uid && !t.private);
    }
    return t.list === filter && !t.private;
  }).sort((a, b) => (a.done - b.done) || (b.urgent - a.urgent) || (b.createdAt - a.createdAt));

  $("tasks").innerHTML = vis.length ? vis.map(t => `<div class="task ${t.done ? "done" : ""}">
    <button class="chk" data-id="${t.id}">${t.done ? "✓" : ""}</button>
    <div class="body">
      <div class="t">${esc(t.title)}</div>
      ${t.photo ? `<img class="task-img" data-img-id="${t.id}" src="${t.photo}" alt="Foto allegata">` : ""}
      <div class="meta">
        ${t.urgent ? '<span class="tag u">Urgente</span>' : ""}
        ${t.private ? '<span class="tag p">🔒 Privato</span>' : ""}
        <span class="tag">${esc(t.list)}</span>
        ${new Date(t.createdAt).toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
        ${t.done && t.doneBy ? " · ✓ " + esc(t.doneBy) : ""}
      </div>
    </div>
    <button class="x" data-del="${t.id}">×</button></div>`).join("") : `<div class="empty">Nessun task qui. 🎉</div>`;

  $("tasks").querySelectorAll(".chk").forEach(b => b.onclick = () => {
    const t = tasks.find(x => x.id === b.dataset.id);
    updateDoc(doc(db, "tasks", t.id), { done: !t.done, doneBy: t.done ? "" : profile.name });
  });
  $("tasks").querySelectorAll(".x").forEach(b => b.onclick = () => {
    if (confirm("Eliminare il task?")) deleteDoc(doc(db, "tasks", b.dataset.del));
  });
  $("tasks").querySelectorAll(".task-img").forEach(img => img.onclick = () => {
    const t = tasks.find(x => x.id === img.dataset.imgId);
    if (t && t.photo) openPhotoModal(t.photo, t.title);
  });
}

$("addBtn").onclick = async () => {
  const titleText = $("title").value.trim();
  if ((!titleText && !pendingPhotoDataUrl) || !db) return;
  const title = titleText || "📷 Foto allegata";
  const isPersonalTab = (filter === "👤");

  const urgent = $("urgent").checked;
  const isPrivate = isPersonalTab ? true : false;
  const photo = pendingPhotoDataUrl || "";

  $("title").value = "";
  $("urgent").checked = false;
  pendingPhotoDataUrl = "";
  $("photoPreviewImg").src = "";

  await addDoc(collection(db, "tasks"), {
    title,
    list,
    urgent,
    private: isPrivate,

    done: false,
    by: profile.name,
    byId: uid,

  if (!isPrivate) {

    }).catch(() => {});

$("title").addEventListener("keydown", e => { if (e.key === "Enter") $("addBtn").click(); });

// --- TURNI HELPERS ---
function getCurrentDept() {
  return activeMainTab === "reception" ? deptData.reception : deptData.sala;
}

function getWeekDates(offset) {
  const now = new Date();
  const day = now.getDay();
  const diffToMon = (day === 0 ? -6 : 1 - day) + offset * 7;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
  const days = [];
  const names = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
  const months = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    days.push({
      iso,
      label: `${names[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`
    });
  }
  return days;
}

$("prevWeekBtn").onclick = () => { weekOffset--; renderShifts(); };
$("nextWeekBtn").onclick = () => { weekOffset++; renderShifts(); };

$("filterAllShifts").onclick = () => {
  shiftFilter = "all";
  $("filterAllShifts").classList.add("on");
  $("filterMyShifts").classList.remove("on");
  renderShifts();
};
$("filterMyShifts").onclick = () => {
  shiftFilter = "mine";
  isAdmin = false;
  isAdminOpen = false;
  $("filterMyShifts").classList.add("on");
  $("filterAllShifts").classList.remove("on");
  renderShifts();
};

// --- ADMIN TOGGLE ---
$("adminToggleBtn").onclick = () => {
  if (shiftFilter !== "all") return;
  if (isAdmin) {
    isAdmin = false;
    isAdminOpen = false;
    renderShifts();
    return;
  }
  const pin = prompt("Inserisci il PIN Amministratore:");
  if (pin === ADMIN_PIN) {
    isAdmin = true;
    isAdminOpen = true;
    renderShifts();
  } else if (pin !== null) {
    alert("PIN errato.");
  }
};

$("adminHeaderClick").onclick = () => {
  if (isAdmin && shiftFilter === "all") {
    isAdminOpen = !isAdminOpen;
    renderShifts();
  }
};

// --- ADMIN: STAFF CRUD ---
$("addStaffBtn").onclick = async () => {
  if (!isAdmin || !db) return;
  const dept = getCurrentDept();
  const name = $("newStaffName").value.trim();
  if (!name) return;
  $("newStaffName").value = "";
  await addDoc(collection(db, `${dept.colPrefix}_staff`), { name, createdAt: Date.now() });
};

// --- ADMIN: SLOTS CRUD ---
$("addSlotBtn").onclick = async () => {
  if (!isAdmin || !db) return;
  const dept = getCurrentDept();
  const code = $("newSlotCode").value.trim().toUpperCase();
  const start1 = $("newSlotStart1").value;
  const end1 = $("newSlotEnd1").value;
  const start2 = $("newSlotStart2").value;
  const end2 = $("newSlotEnd2").value;
  if (!code || !start1 || !end1) {
    alert("Inserisci almeno sigla, ora inizio e ora fine della 1ª fascia.");
    return;
  }
  $("newSlotCode").value = "";
  $("newSlotStart2").value = "";
  $("newSlotEnd2").value = "";
  await addDoc(collection(db, `${dept.colPrefix}_slots`), {
    code,
    start1,
    end1,
    start2: (start2 && end2) ? start2 : "",
    end2: (start2 && end2) ? end2 : "",
    createdAt: Date.now()
  });
};

function openEditSlotModal(dept, sl) {
  const s1 = sl.start1 || sl.start || "07:00";
  const e1 = sl.end1 || sl.end || "11:00";
  const s2 = sl.start2 || "";
  const e2 = sl.end2 || "";

  $("modal").innerHTML = `<div class="modal"><div class="box">
    <h2>✏️ Modifica Turno ${esc(sl.code)}</h2>
    <p>Imposta la 1ª fascia oraria e, se serve, una 2ª fascia spezzata (opzionale):</p>
    <div style="font-weight:600;font-size:13px;margin-bottom:4px">1ª Fascia oraria</div>
    <div class="row" style="margin-bottom:12px">
      <input type="time" id="editS1" value="${esc(s1)}">
      <span>-</span>
      <input type="time" id="editE1" value="${esc(e1)}">
    </div>
    <div style="font-weight:600;font-size:13px;margin-bottom:4px">2ª Fascia oraria (opzionale)</div>
    <div class="row" style="margin-bottom:14px">
      <input type="time" id="editS2" value="${esc(s2)}">
      <span>-</span>
      <input type="time" id="editE2" value="${esc(e2)}">
      <button class="sec" id="clearS2" style="padding:6px 10px;font-size:12px">Rimuovi 2ª</button>
    </div>
    <div class="row">
      <button class="sec" id="cancelEditSlot" style="flex:1">Annulla</button>
      <button class="pri" id="saveEditSlot" style="flex:1">Salva</button>
    </div>
  </div></div>`;

  $("clearS2").onclick = () => {
    $("editS2").value = "";
    $("editE2").value = "";
  };
  $("cancelEditSlot").onclick = () => { $("modal").innerHTML = ""; };
  $("saveEditSlot").onclick = async () => {
    const ns1 = $("editS1").value;
    const ne1 = $("editE1").value;
    const ns2 = $("editS2").value;
    const ne2 = $("editE2").value;
    if (!ns1 || !ne1) {
      alert("Inserisci inizio e fine della 1ª fascia.");
      return;
    }
    $("modal").innerHTML = "";
    await updateDoc(doc(db, `${dept.colPrefix}_slots`, sl.id), {
      start1: ns1,
      end1: ne1,
      start2: (ns2 && ne2) ? ns2 : "",
      end2: (ns2 && ne2) ? ne2 : ""
    });
  };
}

// --- DIRECT DATE ASSIGNMENT MODAL (ADMIN ONLY) ---
function openDayAssignModal(dayObj) {
  if (!isAdmin || shiftFilter !== "all") return;
  const dept = getCurrentDept();
  const currentDayData = dept.shifts[dayObj.iso] || {};

  function drawModal() {
    const sortedStaff = [...dept.staff].sort((a, b) => a.name.localeCompare(b.name));
    const sortedSlots = [...dept.slots].sort((a, b) => a.code.localeCompare(b.code));

    $("modal").innerHTML = `<div class="modal"><div class="box">
      <h2>📅 ${esc(dayObj.label)} (${esc(dept.label)})</h2>
      <p>Tocca i turni accanto a ogni persona per assegnarli o rimuoverli:</p>
      ${sortedStaff.length === 0 ? `<p>Nessuna persona nella lista ${esc(dept.label)}. Aggiungila prima dal pannello admin.</p>` : ""}
      ${sortedStaff.map(st => {
        const assigned = currentDayData[st.name] || [];
        return `<div class="person-row" style="align-items:center">
          <div class="person-name">${esc(st.name)}</div>
          <div class="shift-badges">
            ${sortedSlots.map(sl => {
              const isOn = assigned.includes(sl.id);
              return `<button class="slot-toggle ${isOn ? "active" : ""}" data-person="${esc(st.name)}" data-slot="${sl.id}">
                ${esc(sl.code)} (${esc(formatSlotTime(sl))})
              </button>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
      <div class="row" style="margin-top:16px">
        <button class="pri" id="closeDayModal" style="flex:1">Fatto</button>
      </div>
    </div></div>`;

    $("modal").querySelectorAll(".slot-toggle").forEach(btn => {
      btn.onclick = async () => {
        const person = btn.dataset.person;
        const slotId = btn.dataset.slot;
        const list = currentDayData[person] ? [...currentDayData[person]] : [];
        const idx = list.indexOf(slotId);
        if (idx >= 0) list.splice(idx, 1);
        else list.push(slotId);

        if (list.length > 0) currentDayData[person] = list;
        else delete currentDayData[person];

        drawModal();
        await setDoc(doc(db, `${dept.colPrefix}_shifts`, dayObj.iso), { assignments: currentDayData });
      };
    });

    $("closeDayModal").onclick = () => {
      $("modal").innerHTML = "";
    };
  }

  drawModal();
}

// --- RENDER TURNI ---
function renderShifts() {
  const dept = getCurrentDept();
  const sortedSlots = [...dept.slots].sort((a, b) => a.code.localeCompare(b.code));
  const sortedStaff = [...dept.staff].sort((a, b) => a.name.localeCompare(b.name));

  if (shiftFilter !== "all") {
    isAdmin = false;
    isAdminOpen = false;
  }

  const canShowAdmin = (shiftFilter === "all");
  $("adminToggleBtn").style.display = canShowAdmin ? "inline-block" : "none";

  const arrow = isAdminOpen ? "▲" : "▼";
  $("adminDeptTitle").textContent = `🔓 Gestione Turni ${dept.label} ${arrow}`;
  $("staffSectionLabel").textContent = `1. Lista Persone (${dept.label})`;

  $("adminPanel").style.display = (canShowAdmin && isAdmin) ? "block" : "none";
  $("adminBody").style.display = (canShowAdmin && isAdmin && isAdminOpen) ? "block" : "none";
  $("adminToggleBtn").textContent = isAdmin ? "🔓 Admin" : "🔒 Admin";

  if (canShowAdmin && isAdmin) {
    $("adminStaffList").innerHTML = sortedStaff.length
      ? sortedStaff.map(st => `<div class="list-item">
          <span>${esc(st.name)}</span>
          <div>
            <button class="icon-btn" data-edit-staff="${st.id}" aria-label="Modifica">✏️</button>
            <button class="del-sm" data-del-staff="${st.id}">×</button>
          </div>
        </div>`).join("")
      : `<div style="font-size:13px;color:var(--mute)">Nessuna persona inserita.</div>`;

    $("adminStaffList").querySelectorAll("[data-edit-staff]").forEach(b => b.onclick = async () => {
      const st = dept.staff.find(x => x.id === b.dataset.editStaff);
      const newName = prompt("Modifica nome:", st.name);
      if (newName && newName.trim() && newName.trim() !== st.name) {
        await updateDoc(doc(db, `${dept.colPrefix}_staff`, st.id), { name: newName.trim() });
      }
    });

    $("adminStaffList").querySelectorAll("[data-del-staff]").forEach(b => b.onclick = async () => {
      const st = dept.staff.find(x => x.id === b.dataset.delStaff);
      if (!st) return;
      if (confirm(`Confermi la rimozione di ${st.name} dalla lista e da tutti i turni?`)) {
        await deleteDoc(doc(db, `${dept.colPrefix}_staff`, st.id));

        const updates = [];
        for (const [dateIso, assignments] of Object.entries(dept.shifts)) {
          if (assignments && assignments[st.name]) {
            const updatedAssignments = { ...assignments };
            delete updatedAssignments[st.name];
            updates.push(setDoc(doc(db, `${dept.colPrefix}_shifts`, dateIso), { assignments: updatedAssignments }));
          }
        }
        await Promise.all(updates);
        toast(`🗑️ ${st.name} rimosso con successo.`);
      }
    });

    $("adminSlotsList").innerHTML = sortedSlots.length
      ? sortedSlots.map(sl => `<div class="list-item">
          <span><strong>${esc(sl.code)}</strong> · ${esc(formatSlotTime(sl))}</span>
          <div>
            <button class="icon-btn" data-edit-slot="${sl.id}" aria-label="Modifica orario">✏️</button>
            <button class="del-sm" data-del-slot="${sl.id}">×</button>
          </div>
        </div>`).join("")
      : `<div style="font-size:13px;color:var(--mute)">Nessuna fascia oraria.</div>`;

    $("adminSlotsList").querySelectorAll("[data-edit-slot]").forEach(b => b.onclick = () => {
      const sl = dept.slots.find(x => x.id === b.dataset.editSlot);
      if (sl) openEditSlotModal(dept, sl);
    });
    $("adminSlotsList").querySelectorAll("[data-del-slot]").forEach(b => b.onclick = async () => {
      if (confirm("Confermi l'eliminazione di questa fascia oraria?")) {
        await deleteDoc(doc(db, `${dept.colPrefix}_slots`, b.dataset.delSlot));
      }
    });
  }

  const days = getWeekDates(weekOffset);
  $("weekLabel").textContent = `${days[0].label.split(" ").slice(1).join(" ")} – ${days[6].label.split(" ").slice(1).join(" ")}`;

  const myNameLower = (profile?.name || "").trim().toLowerCase();

  $("weekDaysContainer").innerHTML = days.map(d => {
    const assignments = dept.shifts[d.iso] || {};
    let entries = Object.entries(assignments).filter(([, slotIds]) => Array.isArray(slotIds) && slotIds.length > 0);

    if (shiftFilter === "mine") {
      entries = entries.filter(([person]) => person.trim().toLowerCase() === myNameLower);
    }
    entries.sort((a, b) => a[0].localeCompare(b[0]));

    return `<div class="day-card">
      <div class="day-head ${(canShowAdmin && isAdmin) ? "clickable" : ""}" data-day-iso="${d.iso}">
        <span>${esc(d.label)}</span>
        ${(canShowAdmin && isAdmin) ? `<span style="font-size:12px;font-weight:600">+ Assegna turni</span>` : ""}
      </div>
      ${entries.length === 0
        ? `<div style="font-size:13px;color:var(--mute)">${shiftFilter === "mine" ? "Riposo / Nessun turno" : "Nessun turno assegnato"}</div>`
        : entries.map(([person, slotIds]) => {
            const validSlots = slotIds
              .map(id => dept.slots.find(s => s.id === id))
              .filter(Boolean)
              .sort((a, b) => a.code.localeCompare(b.code));

            if (validSlots.length === 0) return "";

            return `<div class="person-row">
              <div class="person-name">${esc(person)}</div>
              <div class="shift-badges">
                ${validSlots.map(s => `<span class="shift-pill">${esc(s.code)} · ${esc(formatSlotTime(s))}</span>`).join("")}
              </div>
            </div>`;
          }).join("")}
    </div>`;
  }).join("");

  if (canShowAdmin && isAdmin) {
    $("weekDaysContainer").querySelectorAll(".day-head.clickable").forEach(el => {
      el.onclick = () => {
        const dayObj = days.find(x => x.iso === el.dataset.dayIso);
        if (dayObj) openDayAssignModal(dayObj);
      };
    });
  }
}

// --- SETUP LISTENERS FOR A DEPARTMENT ---
function bindDeptListeners(key) {
  const dept = deptData[key];
  onSnapshot(collection(db, `${dept.colPrefix}_staff`), snap => {
    dept.staff = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (activeMainTab === key) renderShifts();
  });

  onSnapshot(collection(db, `${dept.colPrefix}_slots`), snap => {
    dept.slots = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (activeMainTab === key) renderShifts();
  });

  onSnapshot(collection(db, `${dept.colPrefix}_shifts`), snap => {
    const map = {};
    snap.docs.forEach(d => { map[d.id] = d.data().assignments || {}; });
    dept.shifts = map;
    if (activeMainTab === key) renderShifts();
  });
}

// --- BOOTSTRAP ---
(async () => {
  profile = loadProfile();
  if (!profile) {
    profileModal();
  } else {
    renderTodo();
  }

  try {
    const app = initializeApp(firebaseConfig);
    uid = (await signInAnonymously(getAuth(app))).user.uid;
    db = getFirestore(app);
    messaging = getMessaging(app);

    if ("Notification" in window) {
      if (Notification.permission === "granted") {
        registerPush(true);
      } else if (Notification.permission === "default") {
        $("pushBanner").style.display = "flex";
      }
    }

    onMessage(messaging, (payload) => {
      const title = payload.notification?.title || payload.data?.title || "Nuova notifica";
      const body = payload.notification?.body || payload.data?.body || "";
      toast(`🔔 ${title}: ${body}`);
    });
  } catch (e) {
    $("tasks").innerHTML = `<div class="empty">Errore Firebase: ${esc(e.message)}</div>`;
    return;
  }

  onSnapshot(collection(db, "tasks"), snap => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!first) snap.docChanges().forEach(c => {
      if (c.type !== "added" || c.doc.metadata.hasPendingWrites) return;
      const t = c.doc.data();
      if (t.byId === uid || !profile) return;
      const isForMe = (t.assignedTo && t.assignedTo.trim().toLowerCase() === profile.name.trim().toLowerCase()) ||
                      t.title.toLowerCase().includes(profile.name.trim().toLowerCase()) ||
                      profile.follow.includes(t.list);
      if (!isForMe) return;

      unread[filter] = (unread[filter] || 0) + 1;
      toast(`${t.urgent ? "🔴 URGENTE · " : "🆕 "}${t.list}: ${t.title}`);
    });
    first = false;
    renderTodo();
  });

  bindDeptListeners("sala");
  bindDeptListeners("reception");
})();
</script>
